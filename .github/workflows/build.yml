# The release zip contains content derived from third-party fonts, logos and
# vendor CAD (see assets.lock). Distributing it is the repository owner's
# responsibility; no such content is committed to git.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install p7zip and librsvg
        run: sudo apt-get update && sudo apt-get install -y p7zip-full librsvg2-bin
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: third_party
          key: assets-${{ hashFiles('assets.lock') }}
      - run: make package
      - run: make check CHECK_STEP=1
      - name: Render images
        run: make render KICAD_CLI="$PWD/tools/kicad-cli-docker.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: Iridium_Modules-kicad-lib
          path: out/Iridium_Modules-kicad-lib.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Iridium_Modules-renders
          path: out/render/
          if-no-files-found: error

  klc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch KLC checker
        run: |
          git clone --filter=blob:none https://gitlab.com/kicad/libraries/kicad-library-tools.git "$RUNNER_TEMP/klt"
          git -C "$RUNNER_TEMP/klt" checkout a903a695bf4e69905e9e56548f44dd46cdc1130e
          pip install pyyaml asteval typing_extensions
      - run: make footprint symbol
      - run: make klc KLC_DIR="$RUNNER_TEMP/klt/library_utils"

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Iridium_Modules-renders
          path: render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: render
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Iridium_Modules-kicad-lib
      - uses: actions/download-artifact@v4
        with:
          name: Iridium_Modules-renders
          path: render
      - name: Prefix renders with the module name
        run: |
          for f in render/*/*; do
            mv "$f" "render/$(basename "$(dirname "$f")")-$(basename "$f")"
          done
          rmdir render/*/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Iridium_Modules-kicad-lib.zip
            render/*
